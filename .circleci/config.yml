version: 2
jobs:
  build:
    docker:
      - image: cimg/android:2024.01
    steps:
    - checkout
    - run:
        command: |
          sdkmanager "system-images;android-29;default;x86"
        name: Install system image "system-images;android-29;default;x86"
    - run:
        command: |
          find . -name 'build.gradle' | sort | xargs cat |
          shasum | awk '{print $1}' > ./tmp_gradle_cache_seed
        name: Generate cache checksum
    - restore_cache:
        key: gradle-v1a-{{ arch }}-{{ checksum "./tmp_gradle_cache_seed" }}
        name: Restore gradle cache
    - run:
        name: gradle.property
        command: |
          mkdir -p ~/.gradle
          curl $GRADLE_PROPERTY_PATH --output ~/.gradle/gradle.properties
          curl $SECRET_KEY_RING_PATH --output algorigoble2/secret-keys.gpg
    - run:
        command: |
          ./gradlew build
        no_output_timeout: 30m
        name: 'Run: ./gradlew build'
    - save_cache:
        key: gradle-v1a-{{ arch }}-{{ checksum "./tmp_gradle_cache_seed" }}
        name: Save gradle cache
        paths:
          - ~/.gradle/caches
          - ~/.gradle/wrapper
    - save_cache:
        key: gradle-properties-${CIRCLE_WORKFLOW_ID}
        name: Save gradle properties
        paths:
          - ~/.gradle/gradle.properties
    - store_artifacts:
        path: algorigoble2/build/reports
        destination: reports
    - store_test_results:
        path: algorigoble2/build/test-results
    - persist_to_workspace:
        root: .
        paths:
          - .
    resource_class: medium
  deploy:
    docker:
      - image: cimg/android:2024.01
    working_directory: ~/code
    steps:
      - attach_workspace:
          at: .
      - restore_cache:
          key: gradle-v1a-{{ arch }}-{{ checksum "./tmp_gradle_cache_seed" }}
          name: Restore gradle cache
      - restore_cache:
          key: gradle-properties-${CIRCLE_WORKFLOW_ID}
          name: Restore gradle properties
      - run:
          name: Upload Maven Central
          command: ./gradlew publish
  deploy_to_maven_central:
    docker:
      - image: cimg/android:2024.01
    working_directory: ~/code
    steps:
      - attach_workspace:
          at: .
      - restore_cache:
          key: gradle-v1a-{{ arch }}-{{ checksum "./tmp_gradle_cache_seed" }}
          name: Restore gradle cache
      - restore_cache:
          key: gradle-properties-${CIRCLE_WORKFLOW_ID}
          name: Restore gradle properties
      - run:
          name: Build Maven Central
          command: ./gradlew publish
      - run:
            name: Upload to Maven Central
            command: |
              cd algorigoble2/build/staging-deploy
              zip -r staging-deploy.zip com
              curl --request POST --verbose --header 'Authorization: Bearer $MAVEN_CENTRAL_TOKEN' --form bundle=@staging-deploy.zip https://central.sonatype.com/api/v1/publisher/upload
workflows:
  version: 2
  build_deploy:
    jobs:
    - build:
        filters:
          branches:
            only:
              - v2/master
              - v2/develop
              - /v2\/feature\/.*/
              - /v2\/release\/.*/
              - /v2\/hotfix\/.*/
              - /feature\/.*/
              - /release\/.*/
              - /hotfix\/.*/
    - deploy:
        requires:
          - build
        filters:
          branches:
            only:
              - /v2\/release\/.*/
              - /v2\/hotfix\/.*/
              - /release\/.*/
              - /hotfix\/.*/
    - deploy_to_maven_central:
        requires:
          - build
        filters:
          branches:
            only:
              - v2/master
