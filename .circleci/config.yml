version: 2.1
jobs:
  build:
    docker:
      - image: cimg/android:2024.01
    # medium(4GB) 컨테이너에서는 Gradle daemon(-Xmx2048m, metaspace 무제한)과 같은 heap 설정을 상속한
    # Kotlin compile daemon 이 함께 떠서 메모리 한도를 넘고, OOM killer 가 daemon 을 죽인다
    # ("Gradle build daemon disappeared unexpectedly").
    # Kotlin 은 Gradle daemon 안에서 컴파일하게 해 JVM 하나를 없애고, heap/metaspace/worker 수를 제한한다.
    # GRADLE_OPTS 의 값은 프로젝트와 ~/.gradle 의 gradle.properties 보다 우선한다.
    #
    # -Xmx2g 로도 daemon 이 계속 죽어서 더 줄였다. clean build 실측: live heap 최대 ~0.6GB, metaspace ~400MB 인데
    # G1 은 heap 을 -Xmx 근처까지 commit 하므로 2g 는 daemon 하나가 2.5GB 이상을 차지할 수 있다.
    # 여기에 test JVM(기본 heap 512m), aapt2, JVM native 메모리가 더해진다.
    # - -Xmx1536m: live heap 대비 2배 이상 여유가 있고, Full GC 없이 빌드 시간도 거의 같다.
    # - ActiveProcessorCount=2: 컨테이너에서 JVM 이 호스트 CPU 수를 보면 JIT/GC 스레드와 스레드풀이 그만큼 늘어나므로 고정한다.
    # - MALLOC_ARENA_MAX=2: glibc 가 스레드마다 malloc arena 를 만들어 native 메모리가 불어나는 것을 막는다(aapt2 포함 모든 프로세스).
    environment: &gradle_env
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8"
        -Dorg.gradle.workers.max=2
        -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
      MALLOC_ARENA_MAX: "2"
    steps:
    - checkout
    - run:
        command: |
          find . -name 'build.gradle' | sort | xargs cat |
          shasum | awk '{print $1}' > ./tmp_gradle_cache_seed
        name: Generate cache checksum
    - restore_cache:
        key: gradle-v1a-{{ arch }}-{{ checksum "./tmp_gradle_cache_seed" }}
        name: Restore gradle cache
    - run:
        name: gradle.property
        command: |
          mkdir -p ~/.gradle
          curl $GRADLE_PROPERTY_PATH --output ~/.gradle/gradle.properties
          curl $SECRET_KEY_RING_PATH --output algorigoble2/secret-keys.gpg
    - run:
        command: |
          ./gradlew build
        no_output_timeout: 30m
        name: 'Run: ./gradlew build'
    - run:
        # 빌드가 실패해도 실행해서 메모리 한도/최대 사용량/OOM kill 횟수를 남긴다 (cgroup v2, v1 중 있는 쪽).
        # memory.events 의 oom_kill 이 0 보다 크면 OOM killer 가 프로세스를 죽인 것이다.
        name: Container memory usage
        when: always
        command: |
          for f in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.events \
                   /sys/fs/cgroup/memory/memory.limit_in_bytes /sys/fs/cgroup/memory/memory.max_usage_in_bytes \
                   /sys/fs/cgroup/memory/memory.failcnt; do
            if [ -r "$f" ]; then echo "== $f"; cat "$f"; fi
          done
    - save_cache:
        key: gradle-v1a-{{ arch }}-{{ checksum "./tmp_gradle_cache_seed" }}
        name: Save gradle cache
        paths:
          - ~/.gradle/caches
          - ~/.gradle/wrapper
    - save_cache:
        key: gradle-properties-${CIRCLE_WORKFLOW_ID}
        name: Save gradle properties
        paths:
          - ~/.gradle/gradle.properties
    - store_artifacts:
        path: algorigoble2/build/reports
        destination: reports
    - store_test_results:
        path: algorigoble2/build/test-results
    - persist_to_workspace:
        root: .
        paths:
          - .
    resource_class: medium
  deploy:
    docker:
      - image: cimg/android:2024.01
    environment: *gradle_env
    working_directory: ~/code
    steps:
      - attach_workspace:
          at: .
      - restore_cache:
          key: gradle-v1a-{{ arch }}-{{ checksum "./tmp_gradle_cache_seed" }}
          name: Restore gradle cache
      - restore_cache:
          key: gradle-properties-${CIRCLE_WORKFLOW_ID}
          name: Restore gradle properties
      - run:
          name: Upload Maven Central
          command: ./gradlew publish
  deploy_to_maven_central:
    docker:
      - image: cimg/android:2024.01
    environment: *gradle_env
    working_directory: ~/code
    steps:
      - attach_workspace:
          at: .
      - restore_cache:
          key: gradle-v1a-{{ arch }}-{{ checksum "./tmp_gradle_cache_seed" }}
          name: Restore gradle cache
      - restore_cache:
          key: gradle-properties-${CIRCLE_WORKFLOW_ID}
          name: Restore gradle properties
      - run:
          name: Build Maven Central
          command: ./gradlew publish
      - run:
            name: Upload to Maven Central
            command: |
              cd algorigoble2/build/staging-deploy
              zip -r staging-deploy.zip com
              # 작은따옴표 안에서는 환경변수가 치환되지 않으므로 큰따옴표를 사용한다.
              # --verbose 는 Authorization 헤더(토큰)를 로그에 출력하므로 사용하지 않고, 실패 시 응답 본문과 함께 job 을 실패시킨다.
              curl --fail-with-body --request POST --header "Authorization: Bearer ${MAVEN_CENTRAL_TOKEN}" --form bundle=@staging-deploy.zip https://central.sonatype.com/api/v1/publisher/upload
workflows:
  build_deploy:
    jobs:
    - build:
        filters:
          branches:
            only:
              - v2/master
              - v2/develop
              - /v2\/feature\/.*/
              - /v2\/release\/.*/
              - /v2\/hotfix\/.*/
              - /feature\/.*/
              - /release\/.*/
              - /hotfix\/.*/
    - deploy:
        requires:
          - build
        filters:
          branches:
            only:
              - /v2\/release\/.*/
              - /v2\/hotfix\/.*/
              - /release\/.*/
              - /hotfix\/.*/
    - deploy_to_maven_central:
        requires:
          - build
        filters:
          branches:
            only:
              - v2/master
