plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.algorigo.algorigoblelibrary'

    compileSdk 34

    defaultConfig {
        applicationId "com.algorigo.algorigoblelibrary"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 2
        versionName "2.5.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation project(':algorigoble2')

    implementation 'com.algorigo.library:algorigo-logger:1.1.0'

    //ReactiveX
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    //ReactiveX Relay
    implementation 'com.jakewharton.rxrelay3:rxrelay:3.0.1'

    // AlgorigoUtil
    implementation 'com.algorigo.library:algorigoutil:1.5.0'
}